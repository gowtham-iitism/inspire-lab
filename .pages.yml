media:
  - name: images
    label: Images
    input: public/images
    output: /images
content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.json
    fields:
      - { name: heroTitle, label: Hero title, type: string }
      - { name: heroAccent, label: Accent line, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: heroVideo, label: Hero video URL (optional), type: string }
      - { name: heroPoster, label: Hero poster image, type: string }
      - { name: aboutTitle, label: About heading, type: string }
      - { name: aboutText, label: About text, type: text }
      - { name: contactEmail, label: Contact email, type: string }
      - { name: scholarUrl, label: Google Scholar URL, type: string }
  - name: research
    label: Research themes
    type: collection
    path: content/research
    filename: "{slug}.json"
    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: number, label: Number, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: image, label: Image, type: string }
      - { name: order, label: Display order, type: number }
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{slug}.json"
    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: status, label: Status, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: image, label: Image, type: string }
      - { name: collaborators, label: Collaborators, type: string }
      - { name: order, label: Display order, type: number }
  - name: publications
    label: Publications
    type: collection
    path: content/publications
    filename: "{slug}.json"
    fields:
      - { name: title, label: Paper title, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: authors, label: Authors, type: string }
      - { name: venue, label: Journal / conference, type: string }
      - { name: year, label: Year, type: number }
      - { name: doi, label: DOI or URL, type: string }
      - { name: featured, label: Featured, type: boolean }
  - name: team
    label: People
    type: collection
    path: content/team
    filename: "{slug}.json"
    fields:
      - { name: name, label: Name, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: role, label: Role, type: string }
      - { name: bio, label: Short bio, type: text }
      - { name: photo, label: Photo path, type: string }
      - { name: email, label: Email, type: string }
      - { name: order, label: Display order, type: number }
  - name: news
    label: News
    type: collection
    path: content/news
    filename: "{slug}.json"
    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: date, label: Date, type: date }
      - { name: summary, label: Summary, type: text }
      - { name: link, label: Link, type: string }
